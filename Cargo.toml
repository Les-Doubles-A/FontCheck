[package]
name = "fontcheck"
version = "1.0.0"
edition = "2024"
description = "Fast local Windows font browser with license management and auto-update"
repository = "https://github.com/Les-Doubles-A/FontCheck"

[[bin]]
name = "FontCheck"
path = "src/main.rs"

[dependencies]
tao = "0.33"
wry = "0.52"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
